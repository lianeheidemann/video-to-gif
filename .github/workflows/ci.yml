name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A versão do Flutter é fixada de propósito. Com `channel: stable` sozinho, o
# runner pega a stable mais nova do dia e o resultado do CI passa a depender da
# data em que rodou — o `dart format` muda de opinião entre versões e o build
# quebra sem ninguém ter mexido no código. Para atualizar: suba o número aqui,
# rode `dart format lib test` localmente na mesma versão e comite as duas
# coisas juntas.
env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  analise-e-testes:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Os três passos abaixo rodam sempre, mesmo depois de um falhar. Sem
      # isso, um deslize de formatação aborta o job e esconde os erros de
      # análise e de teste, que só aparecem no push seguinte.
      - name: Conferir formatação
        if: ${{ !cancelled() }}
        run: dart format lib test

      - name: Análise estática
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: Testes
        if: ${{ !cancelled() }}
        run: flutter test

      - name: Exportar código formatado
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: codigo-dart-formatado
          path: |
            lib
            test
          retention-days: 1

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    # Necessário para o setup-gradle enviar o grafo de dependências (ver
    # passo "Configurar o Gradle" abaixo). Em PRs de forks o GitHub força o
    # token a somente-leitura mesmo com isso declarado, então o envio já
    # fica restrito a push por conta própria (condição `if` no passo).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # O build de release exige o keystore, que não vive no repositório.
      # Aqui geramos só o APK de debug: o objetivo deste job é pegar erros de
      # Gradle, de fusão de manifesto e de empacotamento das bibliotecas
      # nativas do FFmpeg — não produzir um artefato publicável.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Valida o checksum do gradle-wrapper.jar contra os hashes oficiais da
      # Gradle (protege contra um wrapper adulterado rodar código arbitrário
      # no runner) e, só em push, envia o grafo de dependências resolvido
      # pelo Gradle para o GitHub — sem isso, as libs Android/Kotlin/FFmpeg
      # nativas ficam de fora dos alertas do Dependabot, que só enxerga o
      # pubspec.yaml sozinho.
      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: ${{ github.event_name == 'push' && 'generate-and-submit' || 'disabled' }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Compilar APK de debug
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
