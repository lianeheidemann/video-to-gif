name: Release

# Publica APKs num Release do GitHub.
#
# Dispara de dois jeitos:
#   1. empurrando uma tag de versão:  git tag v1.0.0 && git push origin v1.0.0
#   2. manualmente, na aba Actions -> Release -> Run workflow
#
# Assinatura: se os segredos do keystore estiverem configurados (veja
# docs/PUBLICAR_NA_PLAY_STORE.md), os APKs saem assinados com a sua chave de
# upload e o AAB da Play Store também é gerado. Sem os segredos o workflow
# continua funcionando, mas assina com a chave de depuração — serve para
# instalar e testar, NÃO serve para enviar à Play Store.

on:
  push:
    tags: ['v*']
    branches: ['main']
    paths:
      - 'pubspec.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: 1.0.0). Se vazio, usa a do pubspec.yaml.'
        required: false
        type: string

permissions:
  contents: write

# Mesma versão fixada no ci.yml: o APK publicado tem que sair do mesmo
# toolchain que passou nos testes.
env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build:
    name: Compilar e publicar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Definir a versão
        id: versao
        run: |
          if [ -n "${{ inputs.versao }}" ]; then
            NOME="${{ inputs.versao }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NOME="${GITHUB_REF_NAME#v}"
          else
            NOME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "codigo=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Versão $NOME (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Preparar o keystore
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem segredos de assinatura: os APKs sairão assinados com a chave de depuração."
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          PROPS
          echo "assinado=sim" >> "$GITHUB_OUTPUT"

      - name: Compilar APKs por arquitetura
        run: |
          V="${{ steps.versao.outputs.nome }}"
          mkdir -p entrega
          flutter build apk --release --split-per-abi \
            --build-name="$V" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "entrega/video-em-gif-$V-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "entrega/video-em-gif-$V-armeabi-v7a.apk"

      - name: Compilar APK universal
        run: |
          V="${{ steps.versao.outputs.nome }}"
          flutter build apk --release \
            --build-name="$V" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             "entrega/video-em-gif-$V-universal.apk"

      - name: Compilar AAB para a Play Store
        if: steps.chave.outputs.assinado == 'sim'
        run: |
          V="${{ steps.versao.outputs.nome }}"
          flutter build appbundle --release \
            --build-name="$V" \
            --build-number=${{ steps.versao.outputs.codigo }}
          cp build/app/outputs/bundle/release/app-release.aab \
             "entrega/video-em-gif-$V.aab"

      - name: Listar o que será publicado
        id: arquivos
        run: |
          ls -lh entrega/
          {
            echo "tamanhos<<FIM"
            du -h entrega/* | awk '{printf "- `%s` — %s\n", $2, $1}' | sed 's|entrega/||'
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: Apagar o keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - name: Publicar o Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.nome }}
          name: Video to GIF ${{ steps.versao.outputs.nome }}
          files: entrega/*
          fail_on_unmatched_files: true
          # Sem isto a action só marca o "Latest" quando ela CRIA a linha do
          # release. Reaproveitando uma tag que já existe, ela troca os APKs e
          # o texto mas deixa o selo onde estava — foi assim que a barra
          # lateral do repositório ficou presa numa versão antiga enquanto os
          # runs saíam verdes.
          make_latest: true
          body: |
            ## Novidades

            - O painel de opções do rodapé agora **recolhe**: arraste para baixo
              para ver a prévia inteira e para cima para voltar. Recolhido, os
              stickers e os textos continuam podendo ser selecionados e movidos.
            - **Ajuste de cor** nas três telas — "Editar GIF", "Colocar moldura" e
              "Montagem". Na montagem ele vale para todas as fotos de uma vez, sem
              mexer no fundo, nas bordas nem nos outros elementos.
            - Stickers organizados em **pastas**, com a pasta nova **GitHub** (38
              desenhos) e a pasta **Black**. Também dá para criar, renomear e
              apagar pastas suas.
            - Texto escrito **direto no painel**, sem abrir outra janela, com alça
              própria para girar e **importação de fontes** `.ttf`/`.otf`.
            - "Margem" com as três medidas uma embaixo da outra e um botão para
              zerar tudo.
            - **Pop-up de progresso** ao exportar a montagem, com porcentagem,
              formato, tamanho de saída e botão de cancelar.
            - Montagens exportadas com muito mais nitidez: a largura de saída agora
              vem do arranjo real das fotos (até 1440 px), e não mais do maior lado
              de uma foto só.

            ## Como instalar

            Baixe **`video-em-gif-${{ steps.versao.outputs.nome }}-arm64-v8a.apk`**
            — serve para praticamente todo celular Android dos últimos anos.
            Se der erro de incompatibilidade, use o `armeabi-v7a` (aparelhos
            antigos) ou o `universal`, que funciona em qualquer um por ser
            maior.

            No celular, é preciso permitir a instalação de fontes desconhecidas
            quando o Android perguntar.

            ### Arquivos

            ${{ steps.arquivos.outputs.tamanhos }}

            ### Assinatura

            ${{ steps.chave.outputs.assinado == 'sim'
              && 'Assinado com a chave de upload do projeto. O `.aab` é o arquivo que vai para a Play Console.'
              || '⚠️ Assinado com a chave de DEPURAÇÃO, porque os segredos do keystore não estão configurados neste repositório. Instala e roda normalmente para teste, mas não pode ser enviado à Play Store. Veja `docs/PUBLICAR_NA_PLAY_STORE.md` para configurar os segredos.' }}

            ---

            Versão `${{ steps.versao.outputs.nome }}` · versionCode
            `${{ steps.versao.outputs.codigo }}`
