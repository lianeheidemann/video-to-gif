# 4 GB porque o :app:packageDebug estourava o heap de vez em quando no CI
# (java.lang.OutOfMemoryError no IncrementalSplitterRunnable): as libs
# nativas do FFmpeg fazem o APK passar de 200 MB, e o empacotador carrega
# esses pedaços em memória. Com 2 GB o mesmo commit passava num run e
# falhava no outro. É um teto, não uma reserva — o Gradle só usa o que
# precisa, então não pesa em máquina menor.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
org.gradle.parallel=false
org.gradle.caching=true
# O Flutter Gradle Plugin (dev.flutter.flutter-gradle-plugin) ainda faz cast
# para o tipo antigo do AGP (AbstractAppExtension) internamente — com AGP 9 e
# android.newDsl=true (padrão do AGP 9) o build quebra com ClassCastException.
# Estas duas flags mantêm o comportamento antigo até o Flutter suportar a DSL
# nova. O próprio template do "flutter create" (Flutter 3.47) já as define
# assim por padrão para projetos novos em AGP 9 — não são gambiarra deste
# projeto. Revise ao atualizar o Flutter.
android.newDsl=false
android.builtInKotlin=false
