<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="984" height="1536" viewBox="0 0 984 1536">
  <defs>
    <linearGradient id="frameGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27272A"/>
      <stop offset="1" stop-color="#17171B"/>
    </linearGradient>
  </defs>

  <!--
    Moldura contínua com uma janela interna realmente transparente.
    Janela: x=32, y=82, largura=920, altura=1418.
    A caixa transparente ocupa cerca de 86,3% da imagem, abaixo do
    limite máximo de 90% usado pelo importador do aplicativo.
  -->
  <path
    fill="url(#frameGradient)"
    fill-rule="evenodd"
    d="
      M 46 0
      H 938
      A 46 46 0 0 1 984 46
      V 1490
      A 46 46 0 0 1 938 1536
      H 46
      A 46 46 0 0 1 0 1490
      V 46
      A 46 46 0 0 1 46 0
      Z

      M 48 82
      H 936
      A 16 16 0 0 1 952 98
      V 1484
      A 16 16 0 0 1 936 1500
      H 48
      A 16 16 0 0 1 32 1484
      V 98
      A 16 16 0 0 1 48 82
      Z
    "/>

  <!-- Contorno externo sutil. -->
  <rect x="2" y="2" width="980" height="1532" rx="44"
        fill="none" stroke="#44444D" stroke-width="4"/>

  <!-- Botões superiores. -->
  <circle cx="42" cy="39" r="18" fill="#FF4B55"
          stroke="#D93642" stroke-width="2"/>
  <circle cx="101" cy="39" r="18" fill="#FFBD16"
          stroke="#D99B08" stroke-width="2"/>
  <circle cx="160" cy="39" r="18" fill="#25C866"
          stroke="#159B48" stroke-width="2"/>
</svg>
